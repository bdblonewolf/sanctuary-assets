<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>Sanctuary Zone Builder</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#14161a;color:#e4e2dc;font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;gap:6px;align-items:center;padding:6px;background:#1d2026;border-bottom:1px solid #2c3038;flex-wrap:wrap}
select,button,input[type=number]{font:inherit;color:#e4e2dc;background:#2a2e36;border:1px solid #3a404b;border-radius:8px;min-height:44px;padding:0 10px}
button{min-width:44px;cursor:pointer;touch-action:manipulation}
button:active{background:#3a404b}
button:disabled{opacity:.4}
button.pri{background:#3b5b2e;border-color:#557a42}
button.warn{background:#5a2a2a;border-color:#7a3c3c}
#zone{flex:1;min-width:150px}
#wrap{position:relative;flex:1;min-height:120px;touch-action:none;overflow:hidden}
#zoomb{position:absolute;right:6px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoomb button{width:48px;height:48px;font-size:22px;padding:0;background:#2a2e36e6}
.gk{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin:2px;padding:0 8px;font-size:13px}
.gk.off{opacity:.35;text-decoration:line-through}
.gk img{width:20px;height:20px}
.ro{background:#16283a;border:1px solid #2f5f8a;color:#cfe6ff;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#coord{position:absolute;left:6px;top:6px;background:#000a;padding:4px 8px;border-radius:6px;font:13px ui-monospace,monospace;pointer-events:none}
#status{position:absolute;right:6px;top:6px;background:#000a;padding:4px 8px;border-radius:6px;font-size:12px;max-width:60%;pointer-events:none}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#7a2f12;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px;display:none;max-width:92%;text-align:center}
#tools{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:#1d2026;border-top:1px solid #2c3038;overflow-x:auto}
#tools button{flex:1 1 22%;padding-left:4px;padding-right:4px}
#panel{background:#181b20;border-top:1px solid #2c3038;padding:6px 8px;max-height:42vh;overflow-y:auto}
#panel.hide{display:none}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}
.row label{min-width:52px;color:#9aa0aa;font-size:13px}
.row input[type=range]{flex:1;height:40px}
.row input[type=number]{width:92px}
.kv{font-size:13px;color:#c8c6c0;word-break:break-all}
.kv b{color:#fff}
.flag{background:#5a1d1d;border:1px solid #a33;color:#ffd6d6;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13px}
.note{background:#2c2a18;border:1px solid #6a6230;color:#eee3b0;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13px}
#modal{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;padding:10px;z-index:10}
#modal .box{background:#1d2026;border:1px solid #3a404b;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:100%;overflow:hidden}
#modal h3{margin:0;font-size:16px}
#mbody{overflow-y:auto;flex:1}
#mbody textarea{width:100%;height:46vh;background:#111;color:#dfe;border:1px solid #333;border-radius:6px;font:12px ui-monospace,monospace}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.mitem{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:3px 0;min-height:48px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
#legend{font-size:12px;color:#9aa0aa}
</style>
</head><body>
<div id="app">
 <div id="top">
  <select id="zone" aria-label="Zone"></select>
  <button id="bLoad" class="pri">Load</button>
  <button id="bFit" title="Fit map">Fit</button>
  <button id="bSave" class="pri">Save</button>
 </div>
 <div id="wrap"><canvas id="cv"></canvas><div id="coord">x – z –</div><div id="status">Pick a zone, tap Load</div><div id="toast"></div><div id="zoomb"><button id="bZin" aria-label="Zoom in">+</button><button id="bZout" aria-label="Zoom out">−</button><button id="bFit2" aria-label="Fit" style="font-size:15px">Fit</button></div></div>
 <div id="tools">
  <button id="bUndo">↶ Undo</button><button id="bRedo">↷ Redo</button>
  <button id="bAdd">＋ Add</button><button id="bDup">Dup</button><button id="bDel" class="warn">🗑 Del</button>
  <button id="bSnap">Snap off</button><button id="bLbl">Labels</button><button id="bHelp">?</button>
 </div>
 <div id="panel" class="hide"></div>
</div>
<div id="modal"><div class="box"><h3 id="mtitle"></h3><div id="mbody"></div><div class="btns" id="mbtns"></div></div></div>

// ---- JSON parse that remembers raw number literals (so "0.0" stays "0.0") ----
var RAWN=new WeakMap();
function parseKeep(t){var i=0;
 function ws(){while(i<t.length){var c=t.charCodeAt(i);if(c===32||c===10||c===13||c===9)i++;else break}}

 function num(o,k){var m=/^-?\d+(\.\d+)?([eE][+-]?\d+)?/.exec(t.slice(i,i+40));var r=m[0];i+=r.length;var v=Number(r);if(String(v)!==r){var mp=RAWN.get(o);if(!mp){mp={};RAWN.set(o,mp)}mp[k]=r}return v}
 function val(o,k){ws();var c=t[i];
  if(c==='{'){var ob={};i++;ws();if(t[i]==='}'){i++;return ob}for(;;){ws();var key=str();ws();i++;ob[key]=val(ob,key);ws();if(t[i]===','){i++;continue}i++;return ob}}
  if(c==='['){var a=[];i++;ws();if(t[i]===']'){i++;return a}for(;;){a.push(val(a,a.length));ws();if(t[i]===','){i++;continue}i++;return a}}
  if(c==='"')return str();
  if(t.startsWith('true',i)){i+=4;return true}if(t.startsWith('false',i)){i+=5;return false}if(t.startsWith('null',i)){i+=4;return null}
  return num(o,k)}
 var v=val(null,null);return v}
function cloneKeep(v){if(Array.isArray(v)){var a=v.map(cloneKeep);var m=RAWN.get(v);if(m)RAWN.set(a,Object.assign({},m));return a}

 function d(v,lvl,par,key){
  if(v===null)return 'null';if(v===true)return 'true';if(v===false)return 'false';
  if(typeof v==='number'){var m=par&&RAWN.get(par);return pyNum(v,m?m[key]:undefined)}
  if(typeof v==='string')return pyStr(v);
  var isA=Array.isArray(v),ks=isA?null:Object.keys(v),n=isA?v.length:ks.length;
  if(!n)return isA?'[]':'{}';
  var parts=[];for(var j=0;j<n;j++){var k=isA?j:ks[j];var x=v[k];if(x===undefined)continue;parts.push((isA?'':pyStr(k)+': ')+d(x,lvl+1,v,k))}

  return (isA?'[':'{')+pad+parts.join(','+pad)+end+(isA?']':'}')}
 return d(v,0,null,null)+(fmt.trail?'\n':'')}
function base(p){return String(p||'').split('/').pop().replace(/\.glb$/,'')}
function r3(v){return Math.round(v*1000)/1000}

function blockInfo(z,p){

 items.forEach(function(it){if(it.o==null)return;seen[it.o]=1;var a=orig[it.o],b=it.p,ch=[];
  var ap=a.pos||[],bp=b.pos||[];if(ap[0]!==bp[0]||ap[1]!==bp[1]||ap[2]!==bp[2])ch.push('moved '+fmtP(z,a)+' → '+fmtP(z,b));
  if((a.rotY||0)!==(b.rotY||0))ch.push('rot '+deg(a.rotY||0).toFixed(1)+'° → '+deg(b.rotY||0).toFixed(1)+'°');
  if(a.scale!==b.scale)ch.push('scale '+a.scale+' → '+b.scale);
  if(ch.length)out.push('~ '+nm(a,it.o)+': '+ch.join('; ')+w(a))});
 orig.forEach(function(a,i){if(!seen[i])out.push('- deleted '+nm(a,i)+' at '+fmtP(z,a)+w(a))});
 items.forEach(function(it){if(it.o!=null)return;var b=it.p;out.push('+ added '+nm(b,null)+' at '+fmtP(z,b)+' rot '+deg(b.rotY||0).toFixed(1)+'°'+(b.scale!=null?' scale '+b.scale:'')+(it.src!=null?' (copy of #'+it.src+')':'')+w(b))});

function buildOut(doc,key,items){var o=cloneKeep(doc);o[key]=items.map(function(it){return it.p});return o}
//</core>

// ================= UI =================
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),cx=cv.getContext('2d'),DPR=Math.min(2,window.devicePixelRatio||1);
var Z=null,doc=null,docText='',key='props',orig=[],items=[],W=0,H=0,ORG=[0,0],solid=null,worldW=0;
var view={s:6,ox:0,oy:0},sel=-1,undo=[],redo=[],snap=0,labels=1,dirty=false,warned={};
// ---------- game-code props (read-only overlay from game_props.json, built by extract_props.js) ----------
var GP=null,GPP=null,gsel=-1,GPOFF={mountain:1};
try{var go=JSON.parse(localStorage.getItem('zb_gpoff')||'null');if(go)GPOFF=go}catch(e){}
function loadGP(){if(GPP)return GPP;
 GPP=fetch('game_props.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error();return r.json()})
  .catch(function(){return fetch(RAW+'tools/zone_builder/game_props.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null})})
  .catch(function(){return null}).then(function(j){GP=j;addViewZones();return j});return GPP}
function gpZone(){return GP&&Z&&Z.gp&&GP.zones[Z.gp]||null}
function gps(){var g=gpZone();return g?g.props:[]}
function gpOn(p){return !GPOFF[p.kind]}
// kind -> [shape, colour, default radius m]
var GS={bonfire:['flame','#ff8a1f',.7],body:['x','#c0392b',.55],bones:['x','#e8e0d0',.4],chest:['box','#e8b923',.5],tomb:['slab','#9aa0a6',.6],
 tree:['circle','#3fae4a',.9],gtree:['circle','#3fae4a',.9],palm:['circle','#7ed957',.8],bush:['circle','#2e8b3e',.5],stump:['circle','#8a6a3a',.35],cactus:['circle','#5fbf6f',.4],flower:['pt','#ff7ad9',.2],grass:['pt','#9acd32',.2],
 rock:['blob','#8d8f94',.6],shore_rock:['blob','#7d8a96',.6],rubble:['blob','#77706a',.45],crag:['tri','#6a6560',1],mountain:['tri','#4d4a47',1.2],spire:['tri','#5c5856',.8],
 well:['ring','#3fa7ff',.7],bench:['rect','#9a6b3c',.5],log:['rect','#8a5a2c',.55],pew:['rect','#9a6b3c',.6],stool:['rect','#9a6b3c',.25],chair:['rect','#9a6b3c',.3],table:['rect','#b07a45',.55],bar:['rect','#b07a45',.8],bed:['rect','#c9a27a',.6],bookshelf:['rect','#8e5fd0',.5],
 crate:['box','#c49a5a',.4],barrel:['circle','#a0703a',.35],sack:['circle','#c9b28a',.3],urn:['circle','#b88a6a',.3],pot:['circle','#b88a6a',.25],cart:['rect','#a07a4a',.7],weapon_rack:['rect','#9aa0aa',.5],hearth:['flame','#ff5a1f',.5],
 torch:['dot','#ffd23f',.25],lamp:['dot','#fff07a',.3],arch:['arch','#3fe0ff',.9],stairs:['arch','#5ff0c0',.7],mouth:['ring','#222',.8],
 sign:['post','#ffffff',.35],mark:['post','#ff4f9a',.35],waymark:['post','#ffffff',.35],folio:['box','#b98cff',.25],pillar:['circle','#c8c8c8',.4],shrine:['star','#ff5cf0',.7],organ:['rect','#b98cff',.7],
 boat:['boat','#3f7fd0',1.2],skiff:['boat','#3f7fd0',1],building:['bld','#d0a070',1],fence:['rect','#a08060',.3]};
function gsOf(k){if(GS[k])return GS[k];var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%360;return ['circle','hsl('+h+',60%,60%)',.4]}
function gpRad(p){var g=gsOf(p.kind);return Math.max(g[2],p.w&&p.kind!=='building'?Math.min(p.w,3)/2:0)}
function shape(c,sh,col,x,z,r,a){c.fillStyle=col;c.strokeStyle=col;c.beginPath();
 if(sh==='flame'){c.moveTo(x,z-1.3*r);c.bezierCurveTo(x+1.1*r,z-.2*r,x+.9*r,z+.9*r,x,z+.9*r);c.bezierCurveTo(x-.9*r,z+.9*r,x-1.1*r,z-.2*r,x,z-1.3*r);c.fill();c.fillStyle='#ffe066';c.beginPath();c.moveTo(x,z-.3*r);c.bezierCurveTo(x+.5*r,z+.2*r,x+.45*r,z+.75*r,x,z+.75*r);c.bezierCurveTo(x-.45*r,z+.75*r,x-.5*r,z+.2*r,x,z-.3*r);c.fill()}

 else if(sh==='box'){c.rect(x-r,z-.7*r,2*r,1.4*r);c.fill();c.fillStyle='#5a3a10';c.fillRect(x-r,z-.12*r,2*r,.24*r)}
 else if(sh==='slab'){c.rect(x-.6*r,z-r,1.2*r,2*r);c.fill();c.fillStyle='#55595e';c.fillRect(x-.6*r,z-r,1.2*r,.3*r)}

 else if(sh==='tri'){c.moveTo(x,z-r);c.lineTo(x+r*.9,z+r*.65);c.lineTo(x-r*.9,z+r*.65);c.closePath();c.fill()}
 else if(sh==='ring'){c.lineWidth=r*.35;c.arc(x,z,r*.8,0,6.2832);c.stroke()}
